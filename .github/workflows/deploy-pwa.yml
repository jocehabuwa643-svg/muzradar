name: Deploy PWA

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build shared
        run: npm run build -w @muzradar/shared
      - name: Export web
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          EXPO_PUBLIC_BASE_URL: /muzradar
        run: npm run export:web -w @muzradar/mobile
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
